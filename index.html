<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Title, description, Open Graph, Twitter, canonical, hreflang and JSON-LD are
      NOT set here. Each page sets its own through useSeo()/useJsonLd(), and the
      prerender step writes them into that page's static HTML.
    -->
    <meta name="author" content="INRAIT Web Engineering" />

    <!-- Theme & icons -->
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/webp" href="/images/WhiteLogo.webp" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Analytics and the Meta Pixel are loaded by src/composables/useConsent.js, only after the visitor accepts cookies. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
