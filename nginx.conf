server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject
    application/font-woff
    application/font-woff2;

  # Prerendered pages: /services -> /services/index.html, /bg/blog -> /bg/blog/index.html
  location / {
    try_files $uri $uri/index.html =404;
  }

  # Back-office pages are client-only (never prerendered, never indexed): serve the plain app shell
  location ^~ /admin {
    try_files /spa.html =404;
  }

  # Unknown URLs get a real 404 status with the branded page, not the home page with a 200
  error_page 404 /404/index.html;

  location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }
}
